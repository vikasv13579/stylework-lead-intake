services:
  postgres:
    image: postgres:16-alpine
    container_name: stylework-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stylework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylework}
      POSTGRES_DB: ${POSTGRES_DB:-stylework_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stylework} -d ${POSTGRES_DB:-stylework_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stylework-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stylework-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stylework}:${POSTGRES_PASSWORD:-stylework}@postgres:5432/${POSTGRES_DB:-stylework_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUEST_LIMIT: ${REQUEST_LIMIT:-1mb}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stylework-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stylework-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stylework-network

volumes:
  postgres_data:
    driver: local

networks:
  stylework-network:
    driver: bridge
